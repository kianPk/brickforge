name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify playable files exist
        run: |
          test -f PLAY.html
          test -f docs/index.html
          cmp -s PLAY.html docs/index.html
      - name: Basic HTML sanity
        run: |
          grep -q 'brickforge-best' PLAY.html
          grep -q 'Paused' PLAY.html
